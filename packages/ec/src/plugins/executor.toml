name = "executor"
description = "Share one Executor MCP server with your coding agents."

[settings.url]
type = "url"
required = true
description = "Server origin with its port, such as https://mcp.example.test:4312."

[settings.key]
type = "secret"
description = "API key of at least 32 characters."

[settings.package]
default = "executor@beta"
description = "npm package spec that update installs."

[[mcp_servers]]
name = "executor"
url = "{url}/mcp"
headers = { Authorization = "Bearer {key}" }

[[commands]]
name = "url"
description = "Print the MCP endpoint."
usage = "ec executor url"
effects = ["Makes no network requests."]
examples = ["ec executor url", "ec executor url --json"]

[[commands]]
name = "status"
needs = ["key"]
description = "Check that Executor answers and accepts the key."
usage = "ec executor status"
effects = [
  "Requests /openapi.json with the key, sent to curl on stdin. An unreachable host, a rejected key, or another HTTP error returns exit code 1.",
]
examples = ["ec executor status", "ec executor status --json"]

[[commands]]
name = "restart"
needs = ["key"]
description = "Restart Executor on its host and wait until it answers."
usage = "ec executor restart"
effects = [
  "On the host, restarts the sh.executor.server launch agent, loading it if needed.",
  "Elsewhere, runs ec executor restart on the host over SSH in batch mode. Waits up to 120 seconds, or EXECUTOR_RESTART_TIMEOUT.",
]
examples = ["ec executor restart"]

[[commands]]
name = "update"
needs = ["key"]
description = "Install or upgrade Executor on its host and reload it."
usage = "ec executor update"
effects = [
  "On the host, installs the package with npm, writes the launch agent, reloads it, and serves the port over Tailscale.",
  "Creates ~/.config/executor/encryption-key on a new host and never replaces an existing one.",
  "Elsewhere, runs ec executor update on the host over SSH. The host is the Mac whose Tailscale name matches url.",
]
examples = ["ec executor update"]

[[commands]]
name = "pair"
needs = ["key"]
description = "Print a one-use link that signs a browser into the dashboard."
usage = "ec executor pair"
effects = [
  "Runs executor pair on the host, over SSH from other machines. The link expires in 5 minutes.",
]
examples = ["ec executor pair"]

[[commands]]
name = "serve"
needs = ["key"]
description = "Run the server in the foreground. The launch agent runs this."
usage = "ec executor serve"
effects = [
  "Replaces ec with executor serve, passing the key, the encryption key, the port, and the browser origin in its environment.",
]
examples = ["ec executor serve"]

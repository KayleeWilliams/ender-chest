name: secrets
on: [push, pull_request]
permissions:
  contents: read
jobs:
  scan:
    name: Private data and credentials
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks 8.30.1
        run: |
          curl -fsSLo "$RUNNER_TEMP/gitleaks.tgz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      # PRIVATE_PATTERNS holds the owner's real hostnames, addresses, and keys. Forks do not
      # receive it, so their runs check only for generic credentials.
      - name: Scan every commit
        env:
          PRIVATE_PATTERNS: ${{ secrets.PRIVATE_PATTERNS }}
        run: |
          if [ -n "$PRIVATE_PATTERNS" ]; then
            printf '%s\n' "$PRIVATE_PATTERNS" > "$RUNNER_TEMP/private-patterns"
            export EC_PRIVATE_PATTERNS="$RUNNER_TEMP/private-patterns" EC_REQUIRE_PATTERNS=1
          fi
          tools/check-private.sh --all

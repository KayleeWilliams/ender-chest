name: secrets
on: [push, pull_request]
permissions:
  contents: read
jobs:
  scan:
    name: Private data and credentials
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/private-scan
        with:
          patterns: ${{ secrets.PRIVATE_PATTERNS }}
      - name: Scan every commit
        run: tools/check-private.sh --all

name: ec
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install archive tools on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xz-utils
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: tools/zig fmt --check build.zig src/*.zig
      - run: pnpm exec tsc --noEmit
      - run: pnpm test
  binaries:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [aarch64-macos.13.0, x86_64-macos.13.0, aarch64-linux-musl, x86_64-linux-musl]
    steps:
      - uses: actions/checkout@v4
      - name: Install archive tools on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xz-utils
      - run: tools/zig build -Doptimize=ReleaseSafe -Dtarget=${{ matrix.target }}
      - run: cd zig-out/bin && sha256sum ec > ec.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ec-${{ matrix.target }}
          path: zig-out/bin/ec*

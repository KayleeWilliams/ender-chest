name: release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ec-release
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      source_hash: ${{ steps.plan.outputs.source_hash }}
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install archive tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xz-utils
      - name: Hash Zig sources
        id: hash
        run: |
          set -eu
          (cd packages/ec && ../../tools/zig build -Doptimize=ReleaseSafe)
          hash=$(tr -d '[:space:]' < packages/ec/zig-out/source_hash.txt)
          echo "source_hash=$hash" >> "$GITHUB_OUTPUT"
      - name: List release targets
        id: targets
        run: echo "targets=$(jq -c . packages/ec/src/targets.json)" >> "$GITHUB_OUTPUT"
      - name: Choose the next patch release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_HASH: ${{ steps.hash.outputs.source_hash }}
        run: |
          set -eu
          echo "source_hash=$SOURCE_HASH" >> "$GITHUB_OUTPUT"
          tag=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '[.[] | select(.draft == false and .prerelease == false)][0].tag_name // ""')
          if [ -n "$tag" ]; then
            dir=$(mktemp -d)
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern manifest.json --dir "$dir"
            published=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1])).get("commit", ""))' "$dir/manifest.json")
            if [ "$published" = "$GITHUB_SHA" ]; then
              echo "ec $tag already matches this commit."
              echo "version=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "version=$(tools/release-version.sh "$tag")" >> "$GITHUB_OUTPUT"
  binaries:
    needs: plan
    if: needs.plan.outputs.version != ''
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.targets) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install archive tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xz-utils
      - name: Build the release binary
        run: |
          set -eu
          (cd packages/ec && ../../tools/zig build -Doptimize=ReleaseSafe -Dtarget=${{ matrix.zig }} -Dversion=${{ needs.plan.outputs.version }})
          test "$(tr -d '[:space:]' < packages/ec/zig-out/source_hash.txt)" = "${{ needs.plan.outputs.source_hash }}"
          mkdir -p dist
          cp packages/ec/zig-out/bin/ec "dist/ec-${{ matrix.key }}"
          cp packages/ec/zig-out/source_hash.txt dist/source_hash.txt
          sha256sum "dist/ec-${{ matrix.key }}" | awk '{print $1}' > "dist/ec-${{ matrix.key }}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ec-${{ matrix.key }}
          path: dist/*
  publish:
    needs: [plan, binaries]
    if: needs.plan.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@v4
        with:
          pattern: ec-*
          path: dist
      - name: Prepare and test the release packages
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          SOURCE_HASH: ${{ needs.plan.outputs.source_hash }}
        run: |
          set -eu
          python3 tools/package-release.py --artifacts dist --output publish \
            --version "$VERSION" --commit "$GITHUB_SHA" --source-hash "$SOURCE_HASH"
          sh -n publish/install.sh
          npm install --prefix "$RUNNER_TEMP/ec-npm" --offline --ignore-scripts --no-audit --no-fund "./publish/ender-chest-$VERSION.tgz"
          "$RUNNER_TEMP/ec-npm/node_modules/.bin/ec" --version | grep -F "ec $VERSION "
      - name: Publish the patch release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
          SOURCE_HASH: ${{ needs.plan.outputs.source_hash }}
        run: |
          set -eu
          gh release create "v$VERSION" publish/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "ec $VERSION" \
            --notes "ec $VERSION"$'\n\n'"source $SOURCE_HASH"$'\n'"commit $GITHUB_SHA"
  template:
    needs: [plan, publish]
    if: needs.plan.outputs.version != ''
    runs-on: ubuntu-latest
    env:
      TEMPLATE_TOKEN: ${{ secrets.TEMPLATE_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: env.TEMPLATE_TOKEN != ''
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: env.TEMPLATE_TOKEN != ''
        with:
          repository: ${{ github.repository_owner }}/ender-chest-template
          token: ${{ secrets.TEMPLATE_TOKEN }}
          path: template
      - uses: ./.github/actions/private-scan
        if: env.TEMPLATE_TOKEN != ''
        with:
          patterns: ${{ secrets.PRIVATE_PATTERNS }}
      - name: Publish examples/config to the template
        if: env.TEMPLATE_TOKEN != ''
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -eu
          git -C template config user.name "github-actions[bot]"
          git -C template config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tools/publish-template.sh template --version "$VERSION" --push

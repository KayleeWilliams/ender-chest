name: Set up the private-data scan
description: Installs gitleaks and points tools/check-private.sh at the private pattern list.
inputs:
  patterns:
    description: The PRIVATE_PATTERNS secret. Forks do not receive it, so their scans check only for generic credentials.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Install gitleaks 8.30.1
      shell: bash
      run: |
        curl -fsSLo "$RUNNER_TEMP/gitleaks.tgz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
        echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
        tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
        echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
    # PRIVATE_PATTERNS holds the owner's real hostnames, addresses, and keys.
    - name: Write the private patterns
      shell: bash
      env:
        PRIVATE_PATTERNS: ${{ inputs.patterns }}
      run: |
        if [ -n "$PRIVATE_PATTERNS" ]; then
          printf '%s\n' "$PRIVATE_PATTERNS" > "$RUNNER_TEMP/private-patterns"
          echo "EC_PRIVATE_PATTERNS=$RUNNER_TEMP/private-patterns" >> "$GITHUB_ENV"
          echo "EC_REQUIRE_PATTERNS=1" >> "$GITHUB_ENV"
        fi
